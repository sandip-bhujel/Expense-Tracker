<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Expense</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="preconnect" href="=https://font.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=poppins:wght@400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<!--<h1>Add New Expense</h1>-->
<h1 class="form-title">Add New Expense</h1>
<div th:replace="~{fragments :: navbar('add')}"></div>
<!--&lt;!&ndash;th:action le form kaha submit garney bhancha  ra -->
<!--th: object le html form lai java object sanga connect garaucha -->

<form th:action="@{/expenses-page/add}" th:object="${expense}" method="post">
   <label>Name:</label>
   <input type="text" th:field="*{name}" required><br>  <br> <!--field le entity ko data sanga connect garcha-->

    <label>Amount:</label>
    <input type="number" th:field="*{amount}" required min="0"><br> <br>

    <label>Category:</label>
<!--    <input type="text" th:field="*{category}" required><br> <br>-->
    <select th:field="*{category}" required>
        <option value="" disabled>Select Category</option> <!--kehi select nagrda dekhiney-->

        <option value="Groceries">Groceries</option>
        <option value="Transport">Transport</option>
        <option value="Room Rent">Room Rent</option>
        <option value="Utilities">Utilities</option>
        <option value="Shopping">Shopping</option>
        <option value="Health">Health</option>
        <option value="Phone & Internet">Phone & Internet</option>
        <option value="Baby">Baby</option>
        <option value="Alcohol">Alcohol</option>
        <option value="Travel">Travel</option>
        <option value="Study & Learning">Study & Learning</option>
        <option value="Others">Others</option>

    </select>
<br><br>
    <label>Date:</label>
    <input type="datetime-local" th:field="*{date}" required> <br> <br>

    <label>Description:</label>
    <input type="text" th:field="*{description}" required> <br> <br>


    <button type="submit" class="full-btn">Add Expense</button>


</form>

<!--list page firta janey link -->

<a th:href="@{/expenses-page}">Back to List</a>

</body>
</html>
