# database: value environment variable bata aaunchha

# env variable chha bhane tyo linchha (Render ma), chhaina bhane : pachi ko value (laptop ma)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}




#spring.datasource.url=${DB_URL}
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# purano jastai
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# login garne duita user
app.user1.name=${APP_USER1_NAME}
app.user1.password=${APP_USER1_PASSWORD}
app.user2.name=${APP_USER2_NAME}
app.user2.password=${APP_USER2_PASSWORD}



server.port=${PORT:8080}
